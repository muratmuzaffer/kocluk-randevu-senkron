<!DOCTYPE html>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {

          colors: {
            navy: "#1f1f1f",
            teal: "#92d050",
            sand: "#f7f7f2",
            ink: "#1f1f1f",
            matblue: "#5170ff",

  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link rel="stylesheet" href="/kitap/static/css/app.css" />
